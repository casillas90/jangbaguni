<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>장바구니 계산기 | 품목·금액 자동 합산</title>
  <meta name="description" content="품목과 금액을 적으면 실시간으로 총 금액이 자동 계산되는 깔끔한 장바구니 사이트입니다.">
  <!-- Safari Home Screen Shopping Cart Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="장바구니">
  <meta name="theme-color" id="themeColorMeta" content="#f4f5f7">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div>
        <h1 class="header-title">장바구니 계산기</h1>
        <p class="header-sub" id="currentDateDisplay">오늘의 장보기</p>
      </div>
      <div class="header-actions">
        <button type="button" id="btnTheme" class="icon-btn" title="다크 모드" aria-label="다크 모드">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        </button>
      </div>
    </header>

    <nav class="page-tabs">
      <a href="index.html" class="page-tab active" aria-current="page">장바구니</a>
      <a href="danga.html" class="page-tab">단가계산</a>
    </nav>

    <!-- 총 금액 (실시간 자동 합산) -->
    <section class="card" aria-label="총 금액">
      <span class="card-label">총 합산 금액</span>
      <div class="hero-row">
        <span class="hero-number" id="totalSumDisplay">0</span>
        <span class="hero-unit">원</span>
      </div>
      <span class="hero-meta" id="totalCountBadge">총 0개 품목</span>
    </section>

    <!-- 빠른 입력 -->
    <section class="card">
      <form id="itemForm" class="input-form" autocomplete="off">
        <div class="form-grid">
          <div class="field-col flex-3">
            <label for="nameInput" class="field-title">품목</label>
            <input type="text" id="nameInput" placeholder="예: 사과, 계란, 우유" required>
          </div>
          <div class="field-col flex-2">
            <label for="priceInput" class="field-title">금액 (원)</label>
            <input type="text" inputmode="numeric" id="priceInput" class="num-input" placeholder="금액 입력" required>
          </div>
          <div class="field-col flex-1">
            <label for="qtyInput" class="field-title">수량</label>
            <input type="number" id="qtyInput" class="num-input center" value="1" min="1" max="999">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="addBtn">담기</button>
      </form>
    </section>

    <!-- 장보기 목록 -->
    <section class="card">
      <div class="list-header">
        <div class="list-header-left">
          <h2 class="list-heading">장보기 목록</h2>
          <span class="list-count" id="listCountBadge">0개</span>
        </div>
        <button id="clearAllBtn" class="btn-ghost danger">전체삭제</button>
      </div>

      <ul class="item-list" id="itemList">
        <!-- Rendered dynamically -->
      </ul>

      <div class="empty-state" id="emptyState">
        <p class="empty-main">담은 품목이 없어요</p>
        <span class="empty-subtext">위에 품목과 금액을 적으면 자동으로 더해져요</span>
      </div>

      <!-- 품목이 많을 때 아래에도 전체삭제 -->
      <div class="list-footer" id="listFooter" style="display: none;">
        <button id="bottomClearAllBtn" class="btn-ghost danger">담은 품목 전체삭제</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
