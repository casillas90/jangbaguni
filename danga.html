<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>개당 단가 계산기</title>
  <meta name="description" content="총 금액과 개수를 입력하면 개당 단가를 바로 계산해 줍니다.">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <meta name="apple-mobile-web-app-title" content="단가계산">
  <meta name="theme-color" id="themeColorMeta" content="#f4f5f7">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <div class="app-layout">
    <header class="app-header">
      <div>
        <h1 class="header-title">개당 단가 계산기</h1>
        <p class="header-sub">금액 ÷ 개수 = 1개당 가격</p>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>
        <button type="button" id="btnTheme" class="icon-btn" title="다크 모드" aria-label="다크 모드">
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5" fill="currentColor" stroke="none"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        </button>
      </div>
    </header>

    <nav class="page-tabs">
      <a href="index.html" class="page-tab">장바구니</a>
      <a href="danga.html" class="page-tab active" aria-current="page">단가계산</a>
    </nav>

    <section class="card" aria-live="polite">
      <span class="card-label">1개당 가격</span>
      <div class="hero-row">
        <span class="hero-number" id="unitDisplay">0</span>
        <span class="hero-unit">원</span>
      </div>
      <span class="hero-meta" id="formulaDisplay">금액과 개수를 입력하세요</span>
    </section>

    <section class="card">
      <form id="calcForm" autocomplete="off">
        <div class="field-stack">
          <div class="field-col">
            <label for="priceInput" class="field-title">총 금액 (원)</label>
            <input type="text" inputmode="numeric" enterkeyhint="next" id="priceInput" class="num-input big" placeholder="금액 입력">
          </div>
          <div class="field-col">
            <label for="qtyInput" class="field-title">개수</label>
            <div class="qty-stepper">
              <button type="button" class="step-btn" data-step="-1" aria-label="개수 1 줄이기">−</button>
              <input type="text" inputmode="decimal" enterkeyhint="done" id="qtyInput" class="num-input big center" placeholder="개수">
              <button type="button" class="step-btn" data-step="1" aria-label="개수 1 늘리기">+</button>
            </div>
            <div class="qty-chips" id="qtyChips">
              <button type="button" class="qty-chip">2</button>
              <button type="button" class="qty-chip">4</button>
              <button type="button" class="qty-chip">6</button>
              <button type="button" class="qty-chip">10</button>
              <button type="button" class="qty-chip">12</button>
              <button type="button" class="qty-chip">20</button>
              <button type="button" class="qty-chip">30</button>
            </div>
          </div>
          <div class="field-col">
            <label for="nameInput" class="field-title">상품명 (선택 · 비교할 때만)</label>
            <input type="text" enterkeyhint="done" id="nameInput" placeholder="예: 라면 5입, 생수 2L">
          </div>
        </div>
        <div class="btn-row" style="margin-top: 20px;">
          <button type="button" class="btn btn-secondary" id="resetBtn">지우기</button>
          <button type="submit" class="btn btn-primary">비교 목록에 담기</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <div>
          <h2 class="list-heading">단가 비교</h2>
          <p class="list-hint">여러 상품을 담으면 제일 싼 게 표시돼요</p>
        </div>
        <button class="btn-ghost danger" id="clearBtn" style="display: none;">전체삭제</button>
      </div>
      <ul class="item-list" id="itemList"></ul>
      <div class="empty-state" id="emptyState">
        <p class="empty-main">담은 상품이 없어요</p>
        <span class="empty-subtext">계산만 하려면 위에 입력만 하면 돼요</span>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
  </div>

  <script>
    const STORAGE_KEY = 'unitPriceCompare';
    const priceInput = document.getElementById('priceInput');
    const qtyInput = document.getElementById('qtyInput');
    const nameInput = document.getElementById('nameInput');
    const unitDisplay = document.getElementById('unitDisplay');
    const formulaDisplay = document.getElementById('formulaDisplay');
    const itemList = document.getElementById('itemList');
    const emptyState = document.getElementById('emptyState');
    const clearBtn = document.getElementById('clearBtn');
    const toast = document.getElementById('toast');

    let items = [];
    try { items = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { items = []; }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
    }

    // 소수점은 최대 1자리, 정수면 그대로
    function fmt(n) {
      return n.toLocaleString('ko-KR', { maximumFractionDigits: 1 });
    }

    function getPrice() { return Number(priceInput.value.replace(/[^0-9]/g, '')) || 0; }
    function getQty() { return Number(qtyInput.value.replace(/[^0-9.]/g, '')) || 0; }

    function update() {
      const price = getPrice();
      const qty = getQty();
      document.querySelectorAll('.qty-chip').forEach(c => c.classList.toggle('active', Number(c.textContent) === qty));
      if (price > 0 && qty > 0) {
        unitDisplay.textContent = fmt(price / qty);
        formulaDisplay.textContent = `${fmt(price)}원 ÷ ${fmt(qty)}개`;
      } else {
        unitDisplay.textContent = '0';
        formulaDisplay.textContent = '금액과 개수를 입력하세요';
      }
    }

    // 금액 입력 시 천 단위 콤마 자동
    priceInput.addEventListener('input', () => {
      const digits = priceInput.value.replace(/[^0-9]/g, '');
      priceInput.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      update();
    });

    qtyInput.addEventListener('input', () => {
      let v = qtyInput.value.replace(/[^0-9.]/g, '');
      const firstDot = v.indexOf('.');
      if (firstDot !== -1) v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
      qtyInput.value = v;
      update();
    });

    function setQty(n) {
      qtyInput.value = n > 0 ? String(Math.round(n * 10) / 10) : '';
      update();
    }

    // − / + 버튼 (소수 개수면 1 단위로 반올림해서 이동)
    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = Number(btn.dataset.step);
        const cur = getQty();
        const next = step > 0 ? Math.floor(cur) + 1 : Math.ceil(cur) - 1;
        setQty(Math.max(next, 1));
      });
    });

    // 자주 쓰는 개수 버튼
    document.getElementById('qtyChips').addEventListener('click', (e) => {
      const chip = e.target.closest('.qty-chip');
      if (chip) setQty(Number(chip.textContent));
    });

    // 금액 입력 후 키보드 '다음' → 개수 칸으로
    priceInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); qtyInput.focus(); }
    });
    // 개수 입력 후 '완료' → 키보드만 닫기 (목록에 담지 않음)
    qtyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); qtyInput.blur(); }
    });

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function render() {
      itemList.innerHTML = '';
      emptyState.style.display = items.length ? 'none' : 'flex';
      clearBtn.style.display = items.length ? 'block' : 'none';
      if (!items.length) return;

      const minUnit = Math.min(...items.map(i => i.price / i.qty));
      items.forEach((item, idx) => {
        const unit = item.price / item.qty;
        const isBest = items.length > 1 && unit === minUnit;
        const li = document.createElement('li');
        li.className = 'item-row' + (isBest ? ' best' : '');

        const left = document.createElement('div');
        left.className = 'item-left';
        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent = item.name;
        if (isBest) {
          const badge = document.createElement('span');
          badge.className = 'badge-best';
          badge.textContent = '최저가';
          name.appendChild(badge);
        }
        const detail = document.createElement('div');
        detail.className = 'item-detail';
        detail.textContent = `${fmt(item.price)}원 ÷ ${fmt(item.qty)}개`;
        left.append(name, detail);

        const amount = document.createElement('div');
        amount.className = 'item-amount';
        amount.innerHTML = `${fmt(unit)}원<small>개당</small>`;

        const del = document.createElement('button');
        del.className = 'btn-delete';
        del.title = '삭제';
        del.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        del.addEventListener('click', () => {
          items.splice(idx, 1);
          save();
          render();
        });

        li.append(left, amount, del);
        itemList.appendChild(li);
      });
    }

    function resetInputs() {
      priceInput.value = '';
      qtyInput.value = '';
      nameInput.value = '';
      update();
    }

    document.getElementById('calcForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const price = getPrice();
      const qty = getQty();
      if (!(price > 0 && qty > 0)) {
        showToast('금액과 개수를 입력해 주세요');
        (price > 0 ? qtyInput : priceInput).focus();
        return;
      }
      const name = nameInput.value.trim() || `상품 ${items.length + 1}`;
      items.push({ name, price, qty });
      save();
      render();
      resetInputs();
      showToast('비교 목록에 담았어요');
      priceInput.focus();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      resetInputs();
      priceInput.focus();
    });

    document.getElementById('refreshBtn').addEventListener('click', () => location.reload());

    clearBtn.addEventListener('click', () => {
      if (!confirm('비교 목록을 모두 지울까요?')) return;
      items = [];
      save();
      render();
    });

    render();
    update();
  </script>
</body>
</html>
